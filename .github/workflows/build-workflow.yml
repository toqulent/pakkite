name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Package
        run: |
          npx electron-forge package --platform win32 --arch x64
          npx electron-forge package --platform linux --arch x64
          npx electron-forge package --platform darwin --arch x64

      - name: Archive builds
        run: |
          mv out/pakkite-win32-x64 pakkite-windows-x64
          mv out/pakkite-linux-x64 pakkite-linux-x64
          mv out/pakkite-darwin-x64 pakkite-macos-x64
          chmod +x pakkite-linux-x64/pakkite
          zip -r -y pakkite-windows-x64.zip pakkite-windows-x64
          zip -r -y pakkite-linux-x64.zip pakkite-linux-x64
          zip -r -y pakkite-macos-x64.zip pakkite-macos-x64

      - uses: actions/upload-artifact@v4
        with:
          name: pakkite-${{ github.run_number }}
          path: |
            pakkite-windows-x64.zip
            pakkite-linux-x64.zip
            pakkite-macos-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            pakkite-windows-x64.zip
            pakkite-linux-x64.zip
            pakkite-macos-x64.zip
